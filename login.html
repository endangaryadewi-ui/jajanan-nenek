<!-- Micro-interaction Script -->
<script>
        // Simple password toggle logic
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        
        if (toggleBtn && passInput) {
            toggleBtn.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                toggleBtn.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';
            });
        }

        // Add visual interest to the snack-watermark randomly
        document.addEventListener('DOMContentLoaded', () => {
            const watermark = document.querySelector('.snack-watermark');
            // This just simulates the subtle feeling of a textured background
            watermark.style.backgroundPosition = `${Math.random() * 100}% ${Math.random() * 100}%`;
        });
